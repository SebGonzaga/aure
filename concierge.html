<!DOCTYPE html>
<html lang="en">
<head>
    <script>document.documentElement.classList.add('js')</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auré Concierge | AI Stylist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Specific Styles for Chat Interface */
        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #eee;
            height: 600px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 2px;
            font-size: 0.95rem;
        }
        .bot-message {
            background: #f4f1ea;
            align-self: flex-start;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
        }
        .user-message {
            background: var(--charcoal);
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            outline-color: var(--gold);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html"><img src="https://houseofaure.wordpress.com/wp-content/uploads/2026/01/61f4b78c-4510-40ac-bad1-97534bcc5058-edited.jpg" alt="Auré Logo" style="height: 50px;"></a></div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="about.html">The House</a></li>
            <li><a href="index.html#creations">Creations</a></li>
            <li><a href="behind.html">Behind Auré</a></li>
            <li><a href="care.html">Aftercare</a></li>
            <li><a href="concierge.html">AI Concierge</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Auré Concierge</h1>
        <p>Your Virtual Jewelry Stylist</p>
    </header>

    <section class="chat-section">
        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div class="message bot-message">
                    Welcome to the House of Auré. I am your concierge. Are you looking for something bold for the night, or a quiet icon for the day?
                </div>
            </div>
            <div class="chips">
                <button class="chip">Something bold for the night</button>
                <button class="chip">A quiet everyday icon</button>
                <button class="chip">Gift ideas under ₱1,000</button>
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Type your style preference...">
                <button class="btn-primary" onclick="sendMessage()" type="button">Send</button>
            </div>
        </div>
    </section>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        const pieces = {
            obscura: "Obscura (₱599) is our boldest icon — born in the shadows, where light dares to linger. A signature piece for evenings when you want to be remembered.",
            velour:  "Velour (₱999) is soft darkness, rich with untold stories. Crafted for those who lead with grace — a beautiful piece for special occasions or gifting.",
            sloven:  "Sloven (₱899) is where shadow meets light. A minimalist icon with perfect balance, made for everyday wear.",
            enigma:  "Énigma (₱699) is mysterious and captivating — what cannot be explained, must be felt. A wonderful addition to an existing collection."
        };
        const rules = [
            [/(hello|hi\b|hey|good (morning|afternoon|evening))/, "Welcome to the House of Auré. Are you looking for something bold for the night, or a quiet icon for the day?"],
            [/obscura/, pieces.obscura], [/velour/, pieces.velour], [/sloven/, pieces.sloven], [/(enigma|énigma)/, pieces.enigma],
            [/(bold|night|evening|party|statement|dramatic)/, pieces.obscura + " If you'd like something equally striking but more mysterious, consider Énigma (₱699)."],
            [/(quiet|everyday|daily|minimal|simple|subtle|day)/, pieces.sloven + " For a softer, richer look, Velour (₱999) is lovely too."],
            [/(gift|present|birthday|anniversary|mom|mother|girlfriend|wife|sister)/, "For a gift, Velour (₱999) is our most graceful choice, and Énigma (₱699) is a wonderful option if you'd like something under ₱1,000. Every piece arrives in an Auré pouch."],
            [/(cheap|budget|afford|price|how much|cost|under)/, "Our collection: Obscura ₱599, Énigma ₱699, Sloven ₱899 and Velour ₱999. Obscura is our most accessible icon."],
            [/(care|clean|polish|tarnish|store|storage|wash|water|perfume)/, "To keep your piece shining: avoid liquids, perfumes and lotions, polish gently with a soft lint-free cloth after each wear, and store it in its Auré pouch in a cool, dry place."],
            [/(order|buy|purchase|inquire|how do i|available|stock)/, "To order or check availability, send us a message on Instagram @creationsofaure — Raiza will be happy to help personally."],
            [/(ship|deliver|where|location|batangas|tanauan)/, "We are based in Tanauan City, Batangas. For delivery details, please message us on Instagram @creationsofaure."],
            [/(who|founder|raiza|about)/, "Auré was founded by Raiza Tabudlong in Tanauan City, Batangas — jewellery designed with purpose and worn with confidence."],
            [/(thank|thanks)/, "It is my pleasure. May your Auré piece bring you confidence in every detail."]
        ];
        const fallback = "I would love to help you find your icon. Tell me the mood — bold for the night, a quiet everyday piece, or a gift — or ask about Obscura, Velour, Sloven or Énigma.";

        function reply(text) {
            const q = text.toLowerCase();
            const hit = rules.find(([re]) => re.test(q));
            return hit ? hit[1] : fallback;
        }

        function appendMessage(cls, text) {
            const d = document.createElement('div');
            d.className = `message ${cls}`; d.textContent = text;
            chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight; return d;
        }

        function sendMessage(preset) {
            const text = (typeof preset === 'string' ? preset : input.value).trim();
            if (!text) return;
            appendMessage('user-message', text); input.value = '';
            document.querySelector('.chips')?.remove();
            const typing = appendMessage('bot-message', '');
            typing.innerHTML = '<span class="typing-dots"><i></i><i></i><i></i></span>';
            setTimeout(() => { typing.textContent = reply(text); chatBox.scrollTop = chatBox.scrollHeight; }, 700 + Math.random() * 500);
        }

        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendMessage(c.textContent)));
    </script>
    <script src="script.js" defer></script>
</body>
</html>
