<!DOCTYPE html>
<html lang="en">
<head>
    <script>document.documentElement.classList.add('js')</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auré Concierge | AI Stylist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Specific Styles for Chat Interface */
        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #eee;
            height: 600px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 2px;
            font-size: 0.95rem;
        }
        .bot-message {
            background: #f4f1ea;
            align-self: flex-start;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
        }
        .user-message {
            background: var(--charcoal);
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            outline-color: var(--gold);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html"><img src="https://houseofaure.wordpress.com/wp-content/uploads/2026/01/61f4b78c-4510-40ac-bad1-97534bcc5058-edited.jpg" alt="Auré Logo" style="height: 50px;"></a></div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="about.html">The House</a></li>
            <li><a href="index.html#creations">Creations</a></li>
            <li><a href="behind.html">Behind Auré</a></li>
            <li><a href="care.html">Aftercare</a></li>
            <li><a href="concierge.html">AI Concierge</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Auré Concierge</h1>
        <p>Your Virtual Jewelry Stylist</p>
    </header>

    <section class="chat-section">
        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div class="message bot-message">
                    Welcome to the House of Auré. I am your concierge. Are you looking for something bold for the night, or a quiet icon for the day?
                </div>
            </div>
            <div class="chips">
                <button class="chip">Something bold for the night</button>
                <button class="chip">A quiet everyday icon</button>
                <button class="chip">Gift ideas under ₱1,000</button>
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Type your style preference...">
                <button class="btn-primary" onclick="sendMessage()" type="button">Send</button>
            </div>
        </div>
    </section>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const API = location.protocol === 'file:' ? 'http://localhost:3000/chat' : '/chat';

        function appendMessage(cls, text) {
            const d = document.createElement('div');
            d.className = `message ${cls}`; d.textContent = text;
            chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight; return d;
        }

        async function sendMessage(preset) {
            const text = (preset || input.value).trim();
            if (!text) return;
            appendMessage('user-message', text); input.value = '';
            document.querySelector('.chips')?.remove();
            const typing = appendMessage('bot-message', '');
            typing.innerHTML = '<span class="typing-dots"><i></i><i></i><i></i></span>';
            try {
                const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
                const data = await res.json();
                typing.textContent = data.reply || 'Forgive me, I seem to have lost my words.';
            } catch (err) {
                typing.textContent = "I'm having trouble connecting to the House right now. Please try again.";
                console.error(err);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendMessage(c.textContent)));
    </script>
    <script src="script.js" defer></script>
</body>
</html>
